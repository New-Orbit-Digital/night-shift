          <li>Every button shows its chance before you commit. Risky moves near ${esc("the infected")} also show the ambush chance.</li>
          <li><b>Combat:</b> 2 actions per turn. A failed roll ends your turn immediately (turnover), so do the safe things first.</li>
          <li><b>Exploring</b> a room with enemies raises Threat and risks an ambush. <b>Careful</b> (Wits, +1 tick) or <b>Bold</b> (Fight, noisy if it fails) can skip the check.</li>
          <li><b>Noise</b> from gunfire can pull an enemy from an adjacent room. Muffled rooms never make noise; echoing rooms make more.</li>
          <li>The clock ends the run at ${RULES.clockMax}. Every ${RULES.escalationEvery} ticks, something gets worse.</li>
        </ul>
      </details>
    </div>`;
  $("#scenario").onchange = e => { SETUP.scenario = e.target.value; renderSetup(); };
  document.querySelectorAll("[data-char]").forEach(b => b.onclick = () => { SETUP.charId = b.dataset.char; renderSetup(); });
  $("#reseed").onclick = () => { SETUP.seed = randomSeed(); renderSetup(); };
  $("#seed").oninput = e => SETUP.seed = e.target.value.trim().toUpperCase().slice(0, 24) || randomSeed();
  const cf = $("#cfight"); if (cf) cf.oninput = e => { SETUP.custom.fight = +e.target.value; $("#cf").textContent = SETUP.custom.fight; $("#cw").textContent = 10 - SETUP.custom.fight; document.querySelector("#char-custom .char-stats").innerHTML = `<b>Fight ${SETUP.custom.fight}</b> · <b>Wits ${10 - SETUP.custom.fight}</b>`; };
  const cw = $("#cweapon"); if (cw) cw.onchange = e => SETUP.custom.weapon = e.target.value;
  const ci = $("#citem"); if (ci) ci.onchange = e => SETUP.custom.item = e.target.value;
  $("#begin").onclick = beginRun;
}
function beginRun() {
  const s = SCENARIOS[SETUP.scenario];
  let character;
  if (SETUP.charId === "custom") character = { name: "Custom survivor", role: "Custom", fight: SETUP.custom.fight, wits: 10 - SETUP.custom.fight, perk: null, custom: true, weapon: SETUP.custom.weapon, item: SETUP.custom.item };
  else character = Object.assign({}, s.presets.find(p => p.id === SETUP.charId));
  newGame({ scenario: SETUP.scenario, seed: SETUP.seed || randomSeed(), character });
  $("#setup").hidden = true; $("#game").hidden = false;
  RunLog.flush();
  render();
  window.scrollTo(0, 0);
}

// ---------- Game ----------
function render() {
  if (!G) return;
  renderTop(); renderScene(); renderFeed(); renderDice(); renderActions(); renderSide(); renderEnd();
}
function renderTop() {
  const nextEsc = RULES.escalationEvery - (G.clock % RULES.escalationEvery);
  const pips = Array.from({ length: G.maxWounds }, (_, i) => `<i class="pip ${i < G.wounds ? "hurt" : ""}"></i>`).join("");
  $("#top").innerHTML = `
    <div class="top-id"><span class="scen">${esc(G.scen.name)}</span><span class="who">${esc(G.char.name)} · ${esc(G.char.role)}</span></div>
    <div class="top-stats">
      <span class="stat"><span class="k">Fight</span><b>${G.char.fight}</b></span>
      <span class="stat"><span class="k">Wits</span><b>${G.char.wits}</b></span>
      <span class="stat health ${G.wounds >= G.maxWounds - 1 ? "crit" : ""}"><span class="k">Health</span><span class="pips">${pips}</span><b>${esc(healthName())}</b></span>
      <span class="stat clock"><span class="k">Clock</span><b>${G.clock}/${RULES.clockMax}</b><span class="bar"><span style="width:${(G.clock / RULES.clockMax) * 100}%"></span></span><span class="k">escalation in ${nextEsc}</span></span>
      <span class="stat log ${RunLog.state}"><span class="k">Log</span><b>${esc(RunLog.label())}</b></span>
    </div>`;
}
function renderScene() {
  const r = room(); const nb = bandsFor(r.size);
  const lanes = [2, 1, 0].map(b => {
    const disabled = b >= nb;
    const zs = r.zombies.filter(z => z.band === b).map(z => {
      const idx = r.zombies.indexOf(z) + 1;
      return `<span class="tok ${z.stalker ? "stalker" : ""}" title="${esc(z.beh)}"><b>${z.stalker ? "!" : idx}</b><span class="hp">${"■".repeat(Math.max(0, z.hp))}${"□".repeat(Math.max(0, z.maxhp - z.hp))}</span><span class="beh">${esc(z.stalker ? "stalker" : z.beh)}</span></span>`;
    }).join("");
    return `<div class="lane ${disabled ? "off" : ""}"><span class="lane-k">${RULES.bands[b]}</span><div class="lane-toks">${disabled ? "<span class=na>no room</span>" : zs}</div></div>`;
  }).join("");
  const tags = [`<span class="tag">d${r.size}${r.cramped ? " cramped" : ""}</span>`, `<span class="tag">${r.noise === "echo" ? "Echoing" : r.noise === "muffled" ? "Muffled" : "Normal acoustics"}</span>`];
  if (r.dark) tags.push(`<span class="tag warn">Dark −1</span>`);
  if (r.safe) tags.push(`<span class="tag safe">Safe room</span>`);
  if (r.zombies.length && G.phase === "explore") tags.push(`<span class="tag warn">Threat ${r.threat}</span>`);
  $("#scene").className = "scene " + (r.dark ? "dark " : "") + (G.phase === "combat" ? "fight" : "");
  $("#scene").innerHTML = `
    <div class="scene-head"><h2>${esc(r.name)}</h2><div class="tags">${tags.join("")}</div></div>
    <p class="scene-desc">${esc(r.desc)}</p>
    <div class="lanes">${lanes}<div class="you"><span class="you-tok">YOU${G.combat && G.combat.grabbed ? " · GRABBED" : ""}</span></div></div>`;
}
function renderFeed() {
  const lines = G.lines.slice(-7);
  $("#feed").innerHTML = lines.map((l, i) => `<p class="line ${l.kind} ${i === lines.length - 1 ? "new" : ""}">${l.kind === "pa" ? "<span class=pa-k>PA</span> " : ""}${esc(l.text)}</p>`).join("");
}
function renderDice() {
  $("#dice").innerHTML = G.dice.length ? G.dice.map(d => `
    <div class="die ${d.ok == null ? "info" : (d.ok !== !!d.harmful) ? "ok" : "bad"}">
      <span class="die-face">${d.v}</span>
      <span class="die-meta"><span class="die-l">${esc(d.label)}</span><span class="die-n">d${d.sides}${d.mode === "under" ? " · need ≤ " + d.need : d.mode === "over" ? " · need ≥ " + d.need : ""}</span></span>
    </div>`).join("") : `<p class="fine">Dice appear here when you act.</p>`;
}
function oddsClass(c) { return c == null ? "" : c >= 0.7 ? "good" : c >= 0.4 ? "mid" : "low"; }
function actBtn(a) {
  ACTS.push(a.run || null);
  const idx = ACTS.length - 1;
  return `<button class="act ${oddsClass(a.chance)}" data-act="${idx}" ${a.disabled ? "disabled" : ""} title="${esc(a.disabled ? a.why || "" : "")}">
    <span class="act-main"><span class="act-l">${esc(a.label)}</span>${a.chance != null ? `<span class="odds">${Math.round(a.chance * 100)}%</span>` : ""}</span>
    <span class="act-d">${esc(a.detail || "")}</span>
    <span class="act-meta">${a.cost ? `<span>${esc(a.cost)}</span>` : ""}${a.risk ? `<span class="risk">${esc(a.risk)}</span>` : ""}</span>
  </button>`;
}
function renderActions() {
  ACTS = [];
  let h = "";
  if (G.over) { $("#actions").innerHTML = ""; return; }
  if (G.phase === "combat") {
    const C = G.combat;
    h += `<div class="phase-head"><h3>Combat · round ${C.round}</h3><span class="ap">${Array.from({ length: RULES.ap }, (_, i) => `<i class="${i < C.ap ? "on" : ""}"></i>`).join("")} ${C.ap} action${C.ap === 1 ? "" : "s"} left</span></div>`;
    if (C.incoming.length) h += `<p class="warnline">${C.incoming.length} incoming after the next zombie phase.</p>`;
    if (G.pendingFail) {
      h += `<div class="prompt"><p>Failed. Use Adrenaline to reroll? Same ${pct(G.pendingFail.t)}% chance. A 10 on the reroll costs 1 wound.</p>
        <div class="prompt-row">${actBtn({ label: "Reroll with Adrenaline", chance: G.pendingFail.t / 10, detail: "10% chance of a wound.", run: useAdrenaline })}${actBtn({ label: "Accept the turnover", detail: "Their turn.", run: declineAdrenaline })}</div></div>`;
    } else {
      const A = combatActions();
      h += `<div class="act-group"><span class="grp">Attack</span>${A.filter(a => a.group === "shoot").map(actBtn).join("") || `<p class="fine">Nothing in reach.</p>`}</div>`;
      h += `<div class="act-group"><span class="grp">Tactics</span>${A.filter(a => a.group === "tac").map(actBtn).join("")}</div>`;
      h += `<p class="fine">Zombie phase: each ${esc(termOne())} at Close bites on a d10 of ${RULES.menace} or less (${RULES.menace * 10}%). Others move closer.</p>`;
    }
  } else {
    const r = room(); const hostile = r.zombies.length > 0;
    h += `<div class="phase-head"><h3>${hostile ? "Hostile room" : r.safe ? "Safe room" : "Exploring"}</h3></div>`;
    if (hostile) {
      const t = witsTarget(), f = fightTarget(), base = ambushChance(r, r.threat);
      h += `<div class="modes" role="radiogroup" aria-label="How you move">
        ${[["normal", "Normal", "Ambush " + Math.round(base * 100) + "%"], ["careful", "Careful", "Wits " + pct(t) + "% to skip the check · +" + (G.char.perk === "QUIET_FEET" ? 0 : 1) + " tick"], ["bold", "Bold", "Fight " + pct(f) + "% to skip · fail: 30% noise"]].map(([k, l, d]) => `<button class="mode ${G.mode === k ? "on" : ""}" data-mode="${k}" role="radio" aria-checked="${G.mode === k}"><b>${l}</b><span>${esc(d)}</span></button>`).join("")}
      </div>`;
    }
    const A = exploreActions();
    ["act", "item", "move"].forEach(g => { const L = A.filter(a => a.group === g); if (L.length) h += `<div class="act-group"><span class="grp">${g === "act" ? "Actions" : g === "item" ? "Gear" : "Exits"}</span>${L.map(actBtn).join("")}</div>`; });
  }
  $("#actions").innerHTML = h;
  document.querySelectorAll("#actions [data-act]").forEach(b => b.onclick = () => { const fn = ACTS[+b.dataset.act]; if (fn && !G.over) { fn(); render(); } });
  document.querySelectorAll("#actions [data-mode]").forEach(b => b.onclick = () => { G.mode = b.dataset.mode; render(); });
}
function renderSide() {
  const r = room();
  // room contents
  let h = "";
  if (r.searched || r.safe) {
    const items = r.items.map((it, i) => `<li><span>${esc(itemLabel(it))}</span><button class="mini" data-take="${i}" ${G.phase === "combat" ? "disabled" : ""}>Take</button></li>`).join("");
    const docs = r.docs.map(d => `<li><span>“${esc(G.scen.docs[d].title)}”</span><button class="mini" data-doc="${d}">Read</button></li>`).join("");
    h += `<div class="side-block"><h4>In this room</h4><ul class="list">${items}${docs}${!items && !docs ? "<li class=fine>Nothing here.</li>" : ""}</ul></div>`;
  } else if (!r.safe) h += `<div class="side-block"><h4>In this room</h4><p class="fine">Not searched yet.</p></div>`;
  if (r.safe) {
    h += `<div class="side-block"><h4>Stash (shared)</h4><ul class="list">${G.stash.map((it, i) => `<li><span>${esc(itemLabel(it))}</span><button class="mini" data-unstash="${i}">Take</button></li>`).join("") || "<li class=fine>Empty. Drop items here to stash them.</li>"}</ul></div>`;
  }
  // inventory
  const inv = G.inv.map((it, i) => {
    const d = itemDef(it.type);
    let extra = "";
    if (d.kind === "weapon") extra = ` · ${it.loaded}/${WEAPONS[it.type].mag}${it.type === G.equip ? " · equipped" : ""}`;
    return `<li class="${d.slot ? "" : "free"}"><span>${esc(d.name)}${it.qty ? " (" + it.qty + ")" : ""}${esc(extra)}</span><button class="mini" data-drop="${i}" ${G.phase === "combat" ? "disabled" : ""}>${r.safe ? "Stash" : "Drop"}</button></li>`;
  }).join("");
  h += `<div class="side-block"><h4>Inventory <span class="slots">${slotsUsed()}/${G.slots} slots</span></h4><ul class="list">${inv}<li class="free"><span>Knife · always carried</span></li></ul></div>`;
  // map
  h += `<div class="side-block"><h4>Map</h4>${mapSVG()}<p class="fine">Seed ${esc(G.seed)}</p></div>`;
  $("#side").innerHTML = h;
  document.querySelectorAll("[data-take]").forEach(b => b.onclick = () => { takeItem(+b.dataset.take); render(); });
  document.querySelectorAll("[data-drop]").forEach(b => b.onclick = () => { dropItem(+b.dataset.drop); render(); });
  document.querySelectorAll("[data-unstash]").forEach(b => b.onclick = () => { takeStash(+b.dataset.unstash); render(); });
  document.querySelectorAll("[data-doc]").forEach(b => b.onclick = () => openDoc(+b.dataset.doc));
}
function mapSVG() {
  const S = 44, P = 8;
  const known = G.rooms.filter(r => r.visited || r.known);
  let edges = "", nodes = "";
  G.rooms.forEach(r => { if (!r.visited) return; r.adj.forEach(i => { const a = G.rooms[i]; if (i < r.id && a.visited || !a.visited) { edges += `<line x1="${P + r.x * S + 16}" y1="${P + r.y * S + 16}" x2="${P + a.x * S + 16}" y2="${P + a.y * S + 16}" class="${r.jam.includes(i) ? "jam" : ""}"/>`; } }); });
  known.forEach(r => {
    const cls = ["n", r.id === G.cur ? "cur" : "", r.visited ? "v" : "u", r.safe && r.visited ? "safe" : "", r.isGoal ? "goal" : "", r.locked ? "lock" : "", r.visited && r.zombies.length ? "hot" : ""].join(" ");
    const glyph = r.isGoal ? "★" : r.locked ? "⌧" : r.safe && r.visited ? "+" : r.visited ? (r.zombies.length || "") : "?";
    nodes += `<g class="${cls}"><rect x="${P + r.x * S}" y="${P + r.y * S}" width="32" height="32" rx="3"/><text x="${P + r.x * S + 16}" y="${P + r.y * S + 21}">${glyph}</text><title>${esc(r.visited || r.locked || r.isGoal ? r.name : "Unexplored")}</title></g>`;
  });
  return `<svg class="map" viewBox="0 0 ${P * 2 + 5 * S - 12} ${P * 2 + 5 * S - 12}" role="img" aria-label="Map of explored rooms">${edges}${nodes}</svg>
    <p class="legend"><span>★ goal</span><span>⌧ locked</span><span>+ safe</span><span>n = enemies seen</span><span>? unexplored</span></p>`;
}
function openDoc(i) {
  const d = G.scen.docs[i];
  $("#modal").innerHTML = `<div class="doc" role="dialog" aria-modal="true" aria-label="${esc(d.title)}"><p class="doc-k">${esc(d.author)}</p><h3>${esc(d.title)}</h3><p class="doc-t">${esc(d.text)}</p><button class="primary" id="docclose">Close</button></div>`;
  $("#modal").hidden = false; $("#docclose").onclick = () => { $("#modal").hidden = true; };
  logEv("read", { doc: i });
}
function renderEnd() {
  const el = $("#end");
  if (!G.over) { el.hidden = true; return; }
  el.hidden = false;
  const o = G.over, st = G.stats;
  const title = o.outcome === "win" ? "You made it out" : o.outcome === "dawn" ? "Dawn" : "You died";
  el.innerHTML = `<div class="end-card">
    <p class="end-k">${esc(G.scen.name)} · ${esc(G.char.name)}</p>
    <h2>${title}</h2>
    <p class="end-narr">${esc(G.lines.filter(l => l.kind === "narr").slice(-1)[0]?.text || "")}</p>
    <dl class="end-stats">
      <div><dt>Clock</dt><dd>${o.clock}/${RULES.clockMax}</dd></div><div><dt>Rooms</dt><dd>${st.roomsVisited}</dd></div>
      <div><dt>Kills</dt><dd>${st.kills}</dd></div><div><dt>Shots / hits</dt><dd>${st.shots} / ${st.hits}</dd></div>
      <div><dt>Wounds taken</dt><dd>${st.woundsTaken}</dd></div><div><dt>Heals used</dt><dd>${st.healsUsed}</dd></div>
      <div><dt>Ambushes</dt><dd>${st.ambushes}</dd></div><div><dt>Noise pulls</dt><dd>${st.noisePulls}</dd></div>
      <div><dt>Turnovers</dt><dd>${st.turnovers}</dd></div><div><dt>Seed</dt><dd>${esc(G.seed)}</dd></div>
    </dl>
    <label class="lbl" for="notes">Playtest notes (saved with this run's log)</label>
    <textarea id="notes" rows="4" placeholder="What felt unfair, slow, confusing, or great?">${esc(G.notes)}</textarea>
    <div class="end-row">
      <button class="primary" id="savenotes">Save notes</button>
      <button id="again">Same seed again</button>
      <button id="newrun">New run</button>
      <button class="ghost" id="dl">Download log</button>
    </div>
    <p class="fine" id="endstatus">Log: ${esc(RunLog.label())}. Run ID ${esc(G.runId)}.</p>
  </div>`;
  $("#savenotes").onclick = async () => { G.notes = $("#notes").value.slice(0, 4000); logEv("notes", { len: G.notes.length }); await RunLog.flush(true); $("#endstatus").textContent = "Notes saved. Log: " + RunLog.label() + "."; };
  $("#again").onclick = () => { SETUP.seed = G.seed; beginRun(); };
  $("#newrun").onclick = () => { SETUP.seed = randomSeed(); G = null; $("#game").hidden = true; $("#end").hidden = true; $("#setup").hidden = false; renderSetup(); };
  const dl = $("#dl"); if (dl) dl.onclick = async () => {
    const filename = "night-shift-" + G.runId + ".json", data = JSON.stringify(RunLog.payload(), null, 1);
    if (!RunLog.dl) { // standalone page: plain browser download
      const url = URL.createObjectURL(new Blob([data], { type: "application/json" }));
      const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000); return;
    }
    try { await RunLog.dl.save({ filename, data }); } catch (e) { $("#endstatus").textContent = e && e.code === "declined" ? "Download cancelled." : "Download unavailable here."; } };
}

// ---------- Run log (db) ----------
const RunLog = {
  db: null, dl: null, state: "pending", err: null, writing: false, dirty: false, timer: null,
  label() { return this.state === "on" ? "saving to playtest log" : this.state === "pending" ? "connecting" : this.state === "error" ? "save failed (" + this.err + ")" : "local only (download at end)"; },
  async init() {
    try { this.db = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch (e) { this.db = null; }
    try { this.dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null; } catch (e) { this.dl = null; }
    this.state = this.db ? "on" : "off";
    if (G) { renderTop(); renderEnd(); }
    if (this.db && G) this.flush();
  },
  payload() {
    let events = G.events;
    const base = { runId: G.runId, build: RULES.version, seed: G.seed, scenario: G.scenId, character: { name: G.char.name, role: G.char.role, fight: G.char.fight, wits: G.char.wits, perk: G.char.perk || null, custom: !!G.char.custom, weapon: G.char.weapon || null, item: G.char.item || null }, startedAt: G.startedAt, updatedAt: new Date().toISOString(), status: G.over ? G.over.outcome : "in-progress", cause: G.over ? G.over.cause : null, clock: G.clock, wounds: G.wounds, stats: G.stats, notes: G.notes, eventCount: events.length };
    let doc = Object.assign({}, base, { events });
    if (JSON.stringify(doc).length > 230000) { events = events.slice(0, 40).concat([{ type: "trimmed", n: -1 }], events.slice(-500)); doc = Object.assign({}, base, { events, trimmed: true }); }
    return doc;
  },
  queue() { this.dirty = true; clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), 2500); },
  async flush(force) {
    if (!this.db || !G) return;
    if (this.writing) { this.dirty = true; return; }
    clearTimeout(this.timer);
    this.writing = true; this.dirty = false;
    try { await this.db.doc("runs/" + G.runId).set(this.payload()); this.state = "on"; }
    catch (e) { this.state = "error"; this.err = (e && e.code) || "unknown"; }
    this.writing = false;
    if (G) renderTop();
    if (this.dirty) this.queue();
  }
};
window.RunLog = RunLog;

// ---------- Boot ----------
function boot() {
  renderSetup();
  RunLog.init();
  window.addEventListener("keydown", e => { if (e.key === "Escape") $("#modal").hidden = true; });
}
boot();

</script>
</body>
</html>
